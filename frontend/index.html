<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMA Rentals — Panel de leads</title>
<style>
  /* Paleta EMA Rentals (tomada del sitio): taupe #8c725d, tan #b59f7f, crema #ece5dc, gris #f4f4f4 */
  :root{
    --bg:#f4f4f4; --panel:#ffffff; --panel2:#faf8f5; --line:#e7ded2;
    --txt:#313131; --muted:#8a817a; --brand:#8c725d; --brand-d:#75604e;
    --tan:#b59f7f; --cream:#ece5dc; --ok:#5b8f6a; --warn:#c08a3e; --hot:#a9603f;
    --shadow:0 1px 3px rgba(49,49,49,.06), 0 4px 16px rgba(140,114,93,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
  h1,h2,h3{letter-spacing:.2px}
  input,select,textarea{width:100%;padding:11px 13px;margin:6px 0;background:#fff;
    border:1px solid var(--line);border-radius:9px;color:var(--txt);font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--brand)}
  button{cursor:pointer;border:0;border-radius:9px;padding:10px 16px;background:var(--brand);
    color:#fff;font-weight:600;font-size:14px;transition:background .15s}
  button:hover{background:var(--brand-d)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  button.ghost:hover{background:var(--cream)}
  button.sm{padding:6px 11px;font-size:12.5px}
  button.danger{background:#fff;border:1px solid #e6c9bd;color:var(--hot)}
  button.danger:hover{background:#f7e9e2}
  .wm{font-weight:800;letter-spacing:2px;text-transform:uppercase}
  .wm b{color:var(--brand)}
  #login{display:flex;align-items:center;justify-content:center;height:100vh;
    background:linear-gradient(160deg,#faf8f5 0%,#ece5dc 100%)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px;width:350px;box-shadow:var(--shadow)}
  .card .wm{font-size:24px;margin-bottom:4px}
  .card p{margin:0 0 22px;color:var(--muted);font-size:13px}
  #app{display:none;height:100vh;flex-direction:column}
  header{display:flex;align-items:center;gap:16px;padding:13px 22px;background:#fff;
    border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  header .wm{font-size:18px}
  nav{display:flex;gap:4px;margin-left:14px}
  nav button{background:transparent;color:var(--muted);padding:8px 16px;border-radius:20px}
  nav button.active{background:var(--cream);color:var(--brand-d)}
  header .sp{flex:1}
  header .who{color:var(--muted);font-size:13px}
  main{flex:1;overflow:auto;padding:20px 22px}
  .muted{color:var(--muted)}
  .board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
  .col{background:var(--panel2);border:1px solid var(--line);border-radius:14px;min-width:255px;width:255px;flex:0 0 auto}
  .col h3{margin:0;padding:13px 15px;font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .col h3 span{background:var(--cream);color:var(--brand-d);border-radius:20px;padding:1px 9px;font-size:11px}
  .col .body{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:40px}
  .colsub{font-size:11px;color:var(--muted);padding:7px 14px 3px;line-height:1.4}
  .colinfo{width:18px;height:18px;padding:0;line-height:1;border-radius:50%;cursor:pointer;
    border:1px solid currentColor;background:transparent;color:inherit;opacity:.4;
    font-size:11px;font-weight:700;font-style:italic}
  .colinfo:hover{opacity:1}
  .lead{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .1s,border-color .15s}
  .lead:hover{border-color:var(--tan);transform:translateY(-1px)}
  .lead .n{font-weight:700;font-size:14px}
  .lead .meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
  .badge{display:inline-block;font-size:9.5px;padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.5px}
  .b-hot{background:#f7e9e2;color:var(--hot)}
  .b-ch{display:inline-block;font-size:10px;padding:1px 7px;border-radius:5px;background:var(--cream);color:var(--brand-d);margin-right:4px;font-weight:600}
  .b-brand{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:5px;margin-right:4px;font-weight:700;letter-spacing:.3px}
  .b-brand.office{background:#4e3d30;color:#f0e6dc}
  .b-brand.rentals{background:var(--tan);color:#3a2e22}
  .badge.b-good{background:#e7f2ea;color:#3f7d55;border:1px solid #cfe4d6}
  .b-tipo{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:5px;background:#4e3d30;color:#f0e6dc;font-weight:700;margin-right:4px}
  /* Score con etiqueta */
  .scorepill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    padding:3px 10px;border-radius:20px;margin-top:9px}
  .scorepill .num{font-size:12.5px}
  .s-hi{background:#eef5f0;color:var(--ok);border:1px solid #cfe4d6}
  .s-mid{background:#f7f0e3;color:var(--warn);border:1px solid #eaddc3}
  .s-low{background:#f1efec;color:var(--muted);border:1px solid var(--line)}
  /* Bandeja */
  .inbox{display:flex;gap:14px;height:calc(100vh - 128px)}
  .convlist{width:330px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .conv{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}
  .conv:hover{background:var(--panel2)}
  .conv.active{background:var(--cream)}
  .conv .top{display:flex;justify-content:space-between;font-size:14px;align-items:center}
  .chat{flex:1;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .chat .head{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px;background:var(--panel2)}
  .bub{max-width:72%;padding:9px 13px;border-radius:13px;font-size:14px;line-height:1.45;white-space:pre-wrap;box-shadow:var(--shadow)}
  .bub.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .bub.out{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .sendrow{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff;border-radius:0 0 14px 14px}
  .sendrow input{margin:0}
  .pill{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--cream);border:1px solid var(--line);color:var(--muted)}
  .pill.on{color:var(--ok);border-color:var(--ok);background:#eef5f0}
  .pill.off{color:var(--warn);border-color:var(--warn);background:#f7f0e3}
  .err{color:var(--hot);font-size:13px;min-height:18px}
  /* Modal / drawer perfil del lead */
  .overlay{position:fixed;inset:0;background:rgba(49,49,49,.38);display:none;justify-content:flex-end;z-index:50}
  .overlay.open{display:flex}
  .drawer{width:470px;max-width:94vw;background:var(--bg);height:100%;overflow:auto;
    box-shadow:-8px 0 30px rgba(49,49,49,.18);animation:slidein .18s ease}
  @keyframes slidein{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
  .dhead{background:#fff;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;
    display:flex;align-items:flex-start;gap:10px;z-index:2}
  .dhead .x{margin-left:auto;cursor:pointer;font-size:22px;color:var(--muted);background:none;border:0;padding:0 4px}
  .dhead h2{margin:0;font-size:19px}
  .dhead .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .dbody{padding:18px 20px}
  .scorebox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .scorebox .rowb{display:flex;align-items:center;gap:16px}
  .scorebox .big{font-size:42px;font-weight:800;line-height:1}
  .scorebox .lbl{font-weight:700;font-size:15px}
  .scorebox .exp{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.45}
  .scorebar{height:8px;border-radius:6px;background:var(--cream);overflow:hidden;margin-top:12px}
  .scorebar > i{display:block;height:100%;border-radius:6px}
  .scoreparts{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .scoreparts span{display:inline-flex;align-items:baseline;gap:4px}
  .scoreparts b{font-size:13px;color:var(--txt);font-weight:700}
  .scoreparts i{font-style:normal;opacity:.6}
  .ctxtipo{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:2px 8px;border-radius:20px;border:1px solid}
  .ctxtipo.t-dato{color:var(--muted);border-color:var(--line);background:var(--cream)}
  .ctxtipo.t-regla{color:var(--brand-d);border-color:var(--tan);background:#f3ece2}

  /* ── Fases: tabla con toggles ── */
  .fasesbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
  .fasehead,.fmain{display:grid;grid-template-columns:26px 230px 1fr 152px 152px 74px;gap:10px;align-items:center}
  .fasehead{padding:0 4px 8px;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;
    letter-spacing:.05em;color:var(--muted)}
  .faserow{border-bottom:1px solid var(--line);background:#fff}
  .faserow:last-child{border-bottom:none}
  .faserow.arrastrando{opacity:.4}
  .fmain{padding:9px 4px}
  .fdrag{cursor:grab;color:var(--muted);opacity:.5;font-size:15px;text-align:center;user-select:none}
  .fdrag:active{cursor:grabbing}
  .fdot{width:22px;height:22px;padding:1px;margin:0;border-radius:5px;border:1px solid var(--line);cursor:pointer}
  .ftitulo{display:flex;align-items:center;gap:6px;min-width:0}
  .ftitulo input{margin:0;font-weight:600;border-color:transparent;background:transparent;padding:5px 7px}
  .ftitulo input:hover:not(:disabled){border-color:var(--line);background:#fff}
  .fdesc input{margin:0;border-color:transparent;background:transparent;padding:5px 7px;
    font-size:12.5px;color:var(--muted);text-overflow:ellipsis}
  .fdesc input:hover:not(:disabled){border-color:var(--line);background:#fff}
  .finfo{width:17px;height:17px;flex:0 0 17px;border-radius:50%;border:1px solid var(--line);
    background:var(--cream);color:var(--muted);font-size:10.5px;font-weight:700;font-style:italic;
    line-height:1;padding:0;opacity:.45;cursor:pointer}
  .finfo:hover{opacity:1;color:var(--brand-d);border-color:var(--tan)}
  .fpill{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    font-size:11.5px;font-weight:600;padding:7px 10px;border-radius:9px;cursor:pointer;
    background:#fff;border:1px solid var(--line);color:var(--muted)}
  .fpill i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
  .fpill.on.p-noti{background:#eef5f0;border-color:var(--ok);color:var(--ok)}
  .fpill.on.p-noti i{background:var(--ok)}
  .fpill.on.p-recu{background:#f7f0e3;border-color:var(--warn);color:var(--warn)}
  .fpill.on.p-recu i{background:var(--warn)}
  .facts{display:flex;gap:4px;justify-content:flex-end}
  .flbl{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin-bottom:5px}

  /* ── Recuadro "A quién avisar" (look del de Números sin bot de aseguradora) ── */
  .cbadge{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);
    background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:1px 9px;
    vertical-align:middle;margin-left:5px}
  .addcontacto{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .addcontacto input{margin:0;flex:1;min-width:130px;font-size:12.5px}
  .ctblwrap{border:1px solid var(--line);border-radius:9px;overflow:hidden;max-height:240px;overflow-y:auto}
  .ctbl{width:100%;border-collapse:collapse;font-size:13px}
  .ctbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);
    padding:8px 11px;background:var(--cream);border-bottom:1px solid var(--line);
    position:sticky;top:0}
  .ctbl td{padding:9px 11px;border-bottom:1px solid var(--line)}
  .ctbl tr:last-child td{border-bottom:none}
  .ctacts{text-align:right}
  .cvacio{text-align:center;color:var(--muted);font-size:12.5px;padding:18px 0}
  .favi{background:#f7f0e3;border:1px solid var(--warn);color:#8a5f22;border-radius:9px;
    padding:8px 11px;font-size:12px;margin-bottom:9px}
  .nuevaetapa{width:100%;margin-top:14px;border-style:dashed}
  .stbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px}
  .stbl th{text-align:left;font-size:10.5px;letter-spacing:.04em;color:var(--muted);padding:5px 8px}
  .stbl td{padding:5px 8px;border-top:1px solid var(--line)}
  .stbl td:last-child{text-align:right;font-weight:700;width:52px}
  .stbl.resalta{background:#f6f2ec;border-radius:9px}
  /* ── Kanban: ocultar tarjeta + arrastrar entre columnas ── */
  .lead{position:relative}
  .lead .ocultar{position:absolute;top:5px;right:5px;width:19px;height:19px;padding:0;line-height:1;
    border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:15px;
    opacity:0;cursor:pointer;transition:opacity .12s}
  .lead:hover .ocultar{opacity:.45}
  .lead .ocultar:hover{opacity:1;background:var(--cream);color:var(--hot)}
  .lead.arrastrando{opacity:.4}
  .col .body.destino{background:#ffffff8c;outline:2px dashed var(--tan);outline-offset:-4px;border-radius:9px}

  /* ── Recuadro de No leads ── */
  .hbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .hbar input{margin:0;max-width:280px}
  .htbl{width:100%;border-collapse:collapse;font-size:13px}
  .htbl th{text-align:left;font-size:10.5px;letter-spacing:.05em;color:var(--muted);
    padding:7px 9px;border-bottom:1px solid var(--line)}
  .htbl td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
  .htbl tr:last-child td{border-bottom:none}
  .hacts{text-align:right;white-space:nowrap}
  @media(max-width:900px){
    .htbl{display:block;overflow-x:auto}
    .fasehead{display:none}
    .fmain{grid-template-columns:26px 1fr;grid-auto-rows:auto;row-gap:6px}
    .ctbl{display:block;overflow-x:auto}
  }
  .sec-lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:18px 0 8px}
  .kv{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .kv .row{display:flex;justify-content:space-between;gap:14px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:13.5px}
  .kv .row:last-child{border-bottom:0}
  .kv .row .k{color:var(--muted)}
  .kv .row .v{font-weight:600;text-align:right}
  .kv .row .v.empty{color:#c3bcb3;font-weight:400}
  .dconv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:300px;overflow:auto;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
  .dbtns{display:flex;gap:8px;margin-top:16px}
  .dbtns button{flex:1}
  /* Usuarios */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .panelbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px;max-width:640px}
  .panelbox h3{margin:0 0 12px;font-size:15px}
  .checks{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
  .chk{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer;user-select:none}
  .chk input{width:auto;margin:0}
  .utable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .utable th{background:var(--panel2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:11px 14px}
  .utable td{padding:12px 14px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  .secchip{display:inline-block;font-size:10.5px;background:var(--cream);color:var(--brand-d);border-radius:5px;padding:1px 7px;margin:1px 3px 1px 0;font-weight:600}
  .tag-on{color:var(--ok);font-weight:700;font-size:12px}
  .tag-off{color:var(--muted);font-size:12px}
  .rolechip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--cream);color:var(--brand-d)}
  /* Métricas */
  .filtros{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:18px}
  .filtros .f{display:flex;flex-direction:column}
  .filtros label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .filtros input{margin:0;width:auto}
  .presets{display:flex;gap:6px}
  .presets button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 13px;font-size:12.5px}
  .presets button.active{background:var(--cream);color:var(--brand-d);border-color:var(--tan)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .v{font-size:30px;font-weight:800;line-height:1}
  .kpi .k{color:var(--muted);font-size:12.5px;margin-top:5px}
  .kpi .s{font-size:11.5px;font-weight:600;margin-top:3px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.mgrid{grid-template-columns:1fr}}
  .mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .mcard h3{margin:0 0 14px;font-size:14px}
  .bar{display:grid;grid-template-columns:110px 1fr 42px;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
  .bar .track{background:var(--cream);border-radius:6px;height:12px;overflow:hidden}
  .bar .track > i{display:block;height:100%;border-radius:6px;background:var(--brand)}
  .bar .val{text-align:right;font-weight:700;font-size:12.5px}
  .spark{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
  .spark .d{flex:1;min-width:4px;background:var(--tan);border-radius:3px 3px 0 0;position:relative;transition:background .15s}
  .spark .d:hover{background:var(--brand)}
  .spark .d > i{position:absolute;bottom:0;left:0;right:0;background:var(--brand);border-radius:3px 3px 0 0}
  .sparklbls{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
  /* Perfil estratégico */
  .perfilchip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
  .pform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .pform label{font-size:11px;color:var(--muted);font-weight:600}
  .pform input,.pform select{margin:3px 0 0}
  .opt{display:flex;gap:6px}
  .opt button{flex:1;background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:12.5px;font-weight:600}
  .opt button.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* Cuadrante 2x2 */
  .cuad{display:grid;grid-template-columns:130px 1fr 1fr;gap:10px;align-items:stretch}
  .cuad .axis{display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;
    color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .cuad .axis.y{writing-mode:vertical-rl;transform:rotate(180deg)}
  .quad{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-height:120px;border-top:4px solid}
  .quad .qh{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px}
  .quad .qc{font-size:32px;font-weight:800;margin:8px 0 2px}
  .quad .qd{color:var(--muted);font-size:12px}
  .quad .qhrs{font-size:12px;font-weight:700;margin-top:6px}
  /* Contexto */
  .ctxcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
  .ctxcard .ct{font-weight:700;display:flex;align-items:center;gap:8px}
  .ctxcard .cc{color:var(--txt);font-size:13.5px;margin-top:6px;line-height:1.5;white-space:pre-wrap}
  .ctxcard .cacts{display:flex;gap:6px;margin-top:10px}
  .dot-on{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
  .dot-off{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="wm">EMA <b>Rentals</b></div>
    <p>Panel de leads · acceso del equipo</p>
    <input id="email" type="email" placeholder="Correo" autocomplete="username">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button onclick="login()" style="width:100%">Entrar</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="wm">EMA <b>Rentals</b></div>
    <nav id="nav"></nav>
    <div class="sp"></div>
    <button class="ghost sm" onclick="abrirNoLeads()" title="Números que el bot ignora">No leads</button>
    <div class="who" id="who"></div>
    <button class="ghost" onclick="logout()">Salir</button>
  </header>
  <main>
    <div id="kanban"></div>
    <div id="inbox" style="display:none"></div>
    <div id="resumen" style="display:none"></div>
    <div id="metricas" style="display:none"></div>
    <div id="contexto" style="display:none"></div>
    <div id="fases" style="display:none"></div>
    <div id="usuarios" style="display:none"></div>
  </main>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer" id="drawer"></div>
</div>

<div class="overlay" id="ovnolead" onclick="if(event.target===this)cerrarNoLeads()">
  <div class="drawer" id="drnolead"></div>
</div>

<script>
const API = "";
let TOKEN = localStorage.getItem("ema_token") || "";
let ME = {rol:"", nombre:"", secciones:[]};
let SEC_CAT = [];               // catálogo de secciones [{clave,etiqueta}]
let LEADS_BY_PHONE = {};        // cache del kanban para el perfil

function h(t){ return (t||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function api(path, opts={}){
  opts.headers = Object.assign({"Authorization":"Bearer "+TOKEN}, opts.headers||{});
  const r = await fetch(API+path, opts);
  if(r.status===401){ logout(); throw new Error("sesión expirada"); }
  return r;
}
const puede = (sec) => ME.rol==="dueno" || (ME.secciones||[]).includes(sec);

async function login(){
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("pass").value;
  const err = document.getElementById("loginErr"); err.textContent="";
  const r = await fetch(API+"/api/auth/login", {method:"POST", body:new URLSearchParams({username:email, password:pass})});
  if(!r.ok){ err.textContent = "Correo o contraseña incorrectos"; return; }
  const d = await r.json();
  TOKEN = d.access_token; localStorage.setItem("ema_token", TOKEN);
  boot();
}
function logout(){ localStorage.removeItem("ema_token"); TOKEN=""; location.reload(); }

async function boot(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";
  try{ ME = await (await api("/api/auth/me")).json(); }catch(e){ return; }
  try{ SEC_CAT = await (await api("/api/auth/secciones")).json(); }catch(e){ SEC_CAT=[]; }
  await cargarFases();
  document.getElementById("who").textContent = (ME.nombre||ME.email) + " · " + ME.rol;
  // Nav gateado por secciones
  const tabs = [["leads","Leads"],["bandeja","Bandeja"],["resumen","Resumen"],["metricas","Métricas"],["contexto","Contexto"],["fases","Fases"],["usuarios","Usuarios"]];
  const nav = document.getElementById("nav"); nav.innerHTML="";
  for(const [sec,label] of tabs){
    if(!puede(sec)) continue;
    const b=document.createElement("button"); b.textContent=label; b.dataset.sec=sec;
    b.onclick=()=>show(sec); nav.appendChild(b);
  }
  const first = tabs.map(t=>t[0]).find(puede) || "leads";
  show(first);
}

function show(sec){
  ["kanban","inbox","resumen","metricas","contexto","fases","usuarios"].forEach(id=>document.getElementById(id).style.display="none");
  const map={leads:"kanban",bandeja:"inbox",resumen:"resumen",metricas:"metricas",contexto:"contexto",fases:"fases",usuarios:"usuarios"};
  document.getElementById(map[sec]||"kanban").style.display="block";
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle("active", b.dataset.sec===sec));
  if(sec==='leads') loadKanban();
  else if(sec==='bandeja') loadInbox();
  else if(sec==='resumen') loadResumen();
  else if(sec==='metricas') loadMetricas();
  else if(sec==='contexto') loadContexto();
  else if(sec==='fases') loadFases();
  else if(sec==='usuarios') loadUsuarios();
}

// Fases (columnas del kanban) configurables: nombre + color se leen en vivo.
let FASES = [], FASE_LBL = {}, FASE_COLOR = {};
// Metadatos de cada fase tal como los manda /api/leads/pipeline: los usa el panel de la ⓘ.
let FASES_META = {};
const ESTADO_LABEL = new Proxy({}, {get:(_,k)=> FASE_LBL[k] || k});
const COL_COLOR = new Proxy({}, {get:(_,k)=> FASE_COLOR[k] || "#8c725d"});
async function cargarFases(){
  try{ FASES = await (await api("/api/fases")).json(); }catch(e){ FASES = []; }
  FASE_LBL = {}; FASE_COLOR = {};
  FASES.forEach(f=>{ FASE_LBL[f.clave]=f.nombre; FASE_COLOR[f.clave]=f.color; });
}
const NEC_TXT = {pieza_suelta:"pieza suelta", paquete:"paquete", casa_completa:"casa completa", oficina_completa:"oficina completa"};
const TIPO_LBL = {oficina:"Oficina", departamento:"Departamento", casa:"Casa"};
const TIEMPO_LBL = {"0-6":"6 meses o menos", "6-12":"6 a 12 meses", "12+":"12 meses o más"};
// Las claves internas siguen siendo tipo1/tipo2; lo que cambia es cómo se leen ("Tipo 1" no le
// decía nada a nadie en EMA). Espejo de TIPO_OFICINA_LBL en app/services/bot/leads.py.
const TIPOOF_LBL = {tipo1:"Oficina · renta corta (hasta 1 año)", tipo2:"Oficina · renta larga (12 meses o más)"};
const TIPOOF_CORTO = {tipo1:"renta corta", tipo2:"renta larga"};
function detalleProp(l){
  if(l.tipo_propiedad==='oficina'){
    const d=[]; if(l.oficina_m2)d.push(l.oficina_m2+" m²"); if(l.oficina_personas)d.push(l.oficina_personas+" personas");
    return d.join(" · ");
  }
  if(l.recamaras!=null) return l.recamaras+(l.recamaras===1?" recámara":" recámaras");
  return "";
}
const BRAND_LBL = {rentals:"EMA Rentals", office:"EMA Office"};
const MODELO_LBL = {renta:"Renta", venta:"Venta"};
const PERFIL = {
  socio_estrategico:{lbl:"Socio Estratégico", emoji:"🟢", color:"#3f7d55"},
  aliado_operativo: {lbl:"Aliado Operativo",  emoji:"🔵", color:"#6b8ba4"},
  cliente_premium:  {lbl:"Cliente Premium",   emoji:"🟡", color:"#c8a13e"},
  cliente_estandar: {lbl:"Cliente Estándar",  emoji:"⚪", color:"#9a9188"},
  sin_clasificar:   {lbl:"Sin clasificar",    emoji:"⬜", color:"#c3bcb3"},
};

// Score de PRIORIDAD (no de calidad): ordena leads dentro de una columna. 0 = cuestionario
// incompleto. Bandas alineadas con la ponderación de app/services/bot/leads.py (45/35/20).
function scoreInfo(s){
  s = s||0;
  if(s===0)  return {lbl:"Sin clasificar", cls:"s-low", color:"var(--muted)"};
  if(s>=75)  return {lbl:"Prioridad alta", cls:"s-hi",  color:"var(--ok)"};
  if(s>=50)  return {lbl:"Prioridad media",cls:"s-mid", color:"var(--warn)"};
  return {lbl:"Prioridad baja", cls:"s-low", color:"var(--muted)"};
}
function razonesLead(l){
  const r=[];
  if(l.tipo_propiedad==='casa') r.push("es una casa");
  if(l.tipo_propiedad==='departamento' && (l.recamaras||0)>=2) r.push(l.recamaras+" recámaras");
  if(l.tipo_propiedad==='oficina'){
    if((l.oficina_m2||0)>=100) r.push(l.oficina_m2+" m²");
    if((l.oficina_personas||0)>=20) r.push(l.oficina_personas+" personas");
    if(l.tipo_oficina) r.push(TIPOOF_CORTO[l.tipo_oficina]||"");
  }
  if(l.tiempo_renta==='12+') r.push("renta de 12+ meses");
  return r;
}

async function loadKanban(){
  const cont = document.getElementById("kanban");
  cont.innerHTML = '<div class="muted">Cargando…</div>';
  const d = await (await api("/api/leads/pipeline")).json();
  // Refrescar nombres/colores de fase por si el admin los cambió.
  FASES_META = d.fases || {};
  for(const [k,v] of Object.entries(FASES_META)){ FASE_LBL[k]=v.nombre; FASE_COLOR[k]=v.color; }
  LEADS_BY_PHONE = {};
  let html = '<div class="board">';
  for(const est of d.columnas){
    const arr = d.leads[est]||[];
    const cc = COL_COLOR[est] || "#8c725d";
    const meta = FASES_META[est] || {};
    const sub = meta.descripcion ? `<div class="colsub">${h(meta.descripcion)}</div>` : '';
    html += `<div class="col" style="border:1px solid ${cc}59;border-top:3px solid ${cc};background:${cc}12">
      <h3 style="color:${cc};border-bottom-color:${cc}33"><span style="display:inline-flex;align-items:center;gap:7px">
        <i style="width:9px;height:9px;border-radius:50%;background:${cc};display:inline-block"></i>${ESTADO_LABEL[est]||est}</span>
      <span style="display:inline-flex;align-items:center;gap:6px">
        <button class="colinfo" title="Criterios, mensaje de cierre y cómo se calcula la prioridad"
                onclick="verFaseInfo('${h(est)}')">i</button>
        <span style="background:${cc}26;color:${cc}">${arr.length}</span></span></h3>${sub}<div class="body" data-fase="${h(est)}">`;
    for(const l of arr){
      LEADS_BY_PHONE[l.phone]=l;
      const si = scoreInfo(l.score_calif);
      const buen = l.es_buen_prospecto ? '<span class="badge b-good">BUEN PROSPECTO</span> ' : '';
      const tp = l.tipo_propiedad ? `<span class="b-ch">${TIPO_LBL[l.tipo_propiedad]}</span>` : '';
      const ofi = (l.tipo_propiedad==='oficina' && l.tipo_oficina) ? `<span class="b-tipo">${TIPOOF_CORTO[l.tipo_oficina]||''}</span>` : '';
      const ch = l.source ? `<span class="b-ch">${h(l.source)}</span>` : '';
      const bits = [detalleProp(l), TIEMPO_LBL[l.tiempo_renta], l.zona].filter(Boolean).map(h).join(" · ");
      const pf = PERFIL[l.perfil||'sin_clasificar'];
      const perfilTag = (l.perfil && l.perfil!=='sin_clasificar')
        ? `<div style="margin-top:7px"><span class="perfilchip" style="background:${pf.color}22;color:${pf.color};border:1px solid ${pf.color}55">${pf.emoji} ${pf.lbl}${l.horas_estimadas?(' · '+l.horas_estimadas+'h'):''}</span></div>` : '';
      // stopPropagation en el botón: sin él, el clic burbujea y abre el drawer.
      html += `<div class="lead" draggable="true" data-id="${l.id}" data-phone="${h(l.phone)}"
                    onclick="openPerfil('${h(l.phone)}')">
        <button class="ocultar" title="Borrar del tablero (se borra todo, no se puede deshacer)"
                onclick="event.stopPropagation();borrarLead(${l.id},'${h(l.name||l.phone)}')">×</button>
        <div class="n">${buen}${h(l.name||l.phone)}</div>
        <div class="meta">${tp}${ofi}${ch}<br>${bits||'<span class="muted">sin datos aún</span>'}</div>
        ${perfilTag}
        <span class="scorepill ${si.cls}"><span class="num">${l.score_calif||0}</span> · ${si.lbl}</span></div>`;
    }
    html += '</div></div>';
  }
  html += '</div>';
  cont.innerHTML = html;
  activarArrastreLeads();
}

// Panel de la ⓘ de cada columna. Aquí viven los criterios y el mensaje de cierre de la fase
// (la pantalla de Fases solo lleva los dos toggles), más cómo se reparte el score.
// Las tablas del score vienen de /api/fases/score-info, que las lee de las MISMAS constantes que
// hacen el cálculo, así que el panel no puede desincronizarse del código.
async function verFaseInfo(clave){
  const meta = FASES_META[clave]; if(!meta) return;
  if(!SCORE_INFO) SCORE_INFO = await (await api("/api/fases/score-info")).json();
  const s = SCORE_INFO, admin = ME.rol === "dueno", esOficina = clave.includes("oficina");

  const filaOf = s.tamano.oficina.map(o=>`<tr><td>${o.m2?('≥'+o.m2+' m² o ≥'+o.personas+' personas'):'menor'}</td><td>${o.pts}</td></tr>`).join("");
  const filaRec = s.tamano.recamaras.map(o=>`<tr><td>≥${o.recamaras} recámaras</td><td>${o.pts}</td></tr>`).join("");
  const tPlazo = Object.entries(s.plazo.tabla).map(([k,v])=>`<tr><td>${TIEMPO_LBL[k]||k}</td><td>${v}</td></tr>`).join("");
  const tTipo = Object.entries(s.tipo.tabla).map(([k,v])=>`<tr><td>${TIPO_LBL[k]||k}</td><td>${v}</td></tr>`).join("");
  const campo = (id,val,rows,ph)=> admin
    ? `<textarea id="${id}" rows="${rows}" placeholder="${ph}">${h(val||'')}</textarea>`
    : `<div class="kv"><div class="row"><span class="v ${val?'':'empty'}">${val?h(val):'—'}</span></div></div>`;

  document.getElementById("drawer").innerHTML = `
    <div class="dhead">
      <div><h2>${h(meta.nombre)}</h2>
        <div class="sub">${h(meta.descripcion||'Sin descripción')}</div></div>
      <button class="x" onclick="closeDrawer()">&times;</button>
    </div>
    <div class="dbody">
      <div class="sec-lbl">Criterios de entrada</div>
      <p class="muted" style="font-size:12px;margin:0 0 6px">Qué debe tener el lead para caer en esta etapa.</p>
      ${campo("fi_crit", meta.criterios, 2, "Ej. Casa, o departamento de 2 o más recámaras, con renta de 12 meses o más.")}

      <div class="sec-lbl">Mensaje de cierre</div>
      <p class="muted" style="font-size:12px;margin:0 0 6px">Se le manda al prospecto en cuanto cae aquí. Déjalo vacío para no mandar nada.</p>
      ${campo("fi_msj", meta.mensaje_cierre, 3, "Ej. Perfecto, gracias por la información. En unos momentos un asesor se pondrá en contacto con usted.")}
      ${admin?`<div class="dbtns" style="margin:10px 0 0"><button onclick="guardarFaseInfo(${meta.id},'${h(clave)}')">Guardar</button></div>`:''}

      <div class="sec-lbl" style="margin-top:20px">Cómo se calcula la prioridad</div>
      <p class="muted" style="font-size:12px;margin:0 0 8px">${h(s.nota)}</p>
      <div class="sec-lbl">Tamaño — ${s.tamano.total} puntos</div>
      <table class="stbl ${esOficina?'resalta':''}"><thead><tr><th>Oficina</th><th>pts</th></tr></thead><tbody>${filaOf}</tbody></table>
      <table class="stbl ${esOficina?'':'resalta'}"><thead><tr><th>Casa / Departamento</th><th>pts</th></tr></thead><tbody>${filaRec}</tbody></table>
      <div class="sec-lbl">Plazo — ${s.plazo.total} puntos</div>
      <table class="stbl"><tbody>${tPlazo}</tbody></table>
      <div class="sec-lbl">Tipo de propiedad — ${s.tipo.total} puntos</div>
      <table class="stbl"><tbody>${tTipo}</tbody></table>
    </div>`;
  // `classList`, NO `style.display`: closeDrawer() quita la clase, y un estilo inline le ganaría
  // y dejaría el panel pegado en pantalla.
  document.getElementById("overlay").classList.add("open");
}
async function guardarFaseInfo(id, clave){
  const meta = FASES_META[clave] || {};
  await api("/api/fases/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nombre: meta.nombre,
                         criterios: document.getElementById("fi_crit").value,
                         mensaje_cierre: document.getElementById("fi_msj").value})});
  closeDrawer();
  await loadKanban();
}

// Sacar del tablero BORRA: no hay Historial ni papelera. Si esa persona vuelve a escribir, entra
// otra vez como lead nuevo; para que el bot deje de contestarle está el botón "No lead".
async function borrarLead(id, nombre){
  if(!confirm(`¿Borrar a ${nombre} del tablero?\n\nSe borra TODO: sus datos, su conversación y su bitácora. No se puede deshacer.\n\nSi vuelve a escribir, entrará como lead nuevo (para que el bot ya no le conteste, usa "No lead").`)) return;
  await api("/api/leads/"+id,{method:"DELETE"});
  closeDrawer();
  await loadKanban();
}

// "No lead": marca el TELÉFONO para que el bot no le conteste nunca más, y borra sus datos.
async function noLeadDesdeLead(id, phone, nombre){
  if(!confirm(`¿Marcar a ${nombre} como "No lead"?\n\nEl bot dejará de contestarle para siempre, aunque escriba de nuevo, y se borrarán sus datos y su conversación.\n\nPuedes revertirlo en el botón "No leads" de arriba.`)) return;
  await api("/api/leads/no-lead",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({telefono:phone})});
  closeDrawer();
  await loadKanban();
}
async function moverLead(id, fase){
  await api(`/api/leads/${id}/estado?estado=${encodeURIComponent(fase)}`,{method:"PUT"});
  closeDrawer();
  await loadKanban();
}

// Mover leads a mano entre columnas. El endpoint PUT /api/leads/{id}/estado ya existía; el
// frontend nunca lo llamaba, así que no había forma de mover un lead sin tocar la base.
// Mover a mano NO manda mensaje de cierre ni notificación: eso solo lo hace el bot al clasificar.
function activarArrastreLeads(){
  let origen = null;
  document.querySelectorAll("#kanban .lead").forEach(card=>{
    card.addEventListener("dragstart", e=>{ origen=card; card.classList.add("arrastrando"); e.dataTransfer.effectAllowed="move"; });
    card.addEventListener("dragend", ()=>card.classList.remove("arrastrando"));
  });
  document.querySelectorAll("#kanban .body").forEach(col=>{
    col.addEventListener("dragover", e=>{ e.preventDefault(); col.classList.add("destino"); });
    col.addEventListener("dragleave", ()=>col.classList.remove("destino"));
    col.addEventListener("drop", async e=>{
      e.preventDefault();
      col.classList.remove("destino");
      if(!origen) return;
      const id = origen.dataset.id, fase = col.dataset.fase;
      const actual = (LEADS_BY_PHONE[origen.dataset.phone]||{}).estado;
      origen = null;
      if(!id || !fase || fase===actual) return;
      await api(`/api/leads/${id}/estado?estado=${encodeURIComponent(fase)}`,{method:"PUT"});
      await loadKanban();
    });
  });
}

// ─────────── No leads (números que el bot ignora) ───────────
// Vive en un recuadro aparte, no en una pestaña: es una lista corta que casi nunca se toca.
async function abrirNoLeads(){
  document.getElementById("ovnolead").classList.add("open");
  await pintarNoLeads();
}
function cerrarNoLeads(){ document.getElementById("ovnolead").classList.remove("open"); }

async function pintarNoLeads(){
  const lista = await (await api("/api/leads/no-lead/lista")).json();
  const filas = lista.map(c=>`<tr>
      <td><b>${h(c.telefono)}</b>${c.motivo?`<div class="muted" style="font-size:11.5px">${h(c.motivo)}</div>`:''}</td>
      <td class="hacts"><button class="ghost sm" onclick="quitarNoLead('${h(c.telefono)}')">Quitar</button></td>
    </tr>`).join("");
  document.getElementById("drnolead").innerHTML = `
    <div class="dhead">
      <div><h2>No leads</h2>
        <div class="sub">Números a los que el bot nunca le contesta</div></div>
      <button class="x" onclick="cerrarNoLeads()">&times;</button>
    </div>
    <div class="dbody">
      <p class="muted" style="font-size:12.5px;margin:0 0 14px">
        Proveedores, tu propio número, spam. La marca es permanente y por teléfono: aunque vuelvan a
        escribir, el bot los ignora y no aparecen en el tablero. Quitarlos de aquí hace que el bot
        les vuelva a contestar (no regresa los datos que se borraron al marcarlos).
      </p>
      <div class="hbar">
        <input id="nl_tel" placeholder="Teléfono, ej. 528110000000"
               onkeydown="if(event.key==='Enter')agregarNoLead()">
        <button class="ghost sm" onclick="agregarNoLead()">Agregar</button>
      </div>
      ${lista.length
        ? `<table class="htbl"><thead><tr><th>Teléfono</th><th></th></tr></thead><tbody>${filas}</tbody></table>`
        : '<div class="muted">No hay ningún número bloqueado.</div>'}
    </div>`;
}

async function agregarNoLead(){
  const tel = (document.getElementById("nl_tel").value||"").trim();
  if(!tel) return;
  if(!confirm(`¿Marcar ${tel} como No lead?\n\nEl bot dejará de contestarle para siempre. Si ese número tiene un lead en el tablero, se borrará con toda su conversación.`)) return;
  await api("/api/leads/no-lead",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({telefono:tel})});
  await pintarNoLeads();
  await loadKanban();
}
async function quitarNoLead(tel){
  if(!confirm(`¿Quitar ${tel} de la lista?\n\nEl bot volverá a contestarle y, si escribe, entrará al tablero como lead nuevo.`)) return;
  await api("/api/leads/no-lead/"+encodeURIComponent(tel),{method:"DELETE"});
  await pintarNoLeads();
}
// ─────────── Perfil del lead (drawer) ───────────
let PF_USO = null;
async function openPerfil(phone){
  const l = LEADS_BY_PHONE[phone];
  if(!l) return;
  PF_USO = l.uso || null;
  const si = scoreInfo(l.score_calif);
  const razones = razonesLead(l);

              <button data-v="propio" class="${l.uso==='propio'?'sel':''}" onclick="pfPick('propio')">Uso propio</button>

function irAlChat(phone){ closeDrawer(); show('bandeja'); setTimeout(()=>openConv(phone), 120); }
function pfPick(val){
  PF_USO = val;
  document.querySelectorAll('#pf_uso button').forEach(b=>b.classList.toggle('sel', b.dataset.v===val));
}
async function guardarPerfil(id){
  const body = {
    ticket_mensual: parseInt(document.getElementById("pf_ticket").value)||0,
    uso: PF_USO,
    potencial_escala: document.getElementById("pf_escala").value,
    urgencia_cierre: document.getElementById("pf_urg").value,
    estructura: document.getElementById("pf_estruct").value,
  };
  const r = await api("/api/leads/"+id+"/perfil", {method:"PUT",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const d = await r.json();
  if(d.phone){ LEADS_BY_PHONE[d.phone] = d; openPerfil(d.phone); }
}

let CONVS=[];
async function loadInbox(){
  const cont = document.getElementById("inbox");
  cont.innerHTML = '<div class="inbox"><div class="convlist" id="convlist"></div>'+
    '<div class="chat" id="chat"><div class="msgs muted" style="padding:24px">Elige una conversación</div></div></div>';
  CONVS = await (await api("/api/conversaciones")).json();
  const list = document.getElementById("convlist");
  const header = `<div style="padding:10px;border-bottom:1px solid var(--line)"><button class="ghost sm" style="width:100%" onclick="nuevaPrueba()">＋ Nueva prueba del bot</button></div>`;
  if(!CONVS.length){ list.innerHTML=header+'<div class="muted" style="padding:16px">Sin conversaciones aún</div>'; return; }
  list.innerHTML = header + CONVS.map(c=>`<div class="conv" onclick="openConv('${h(c.phone)}')">
    <div class="top"><b>${h(c.name||c.phone)}</b><span class="b-ch">${h(c.channel)}</span></div>
    <div class="meta muted" style="font-size:12px">${c.estado?(ESTADO_LABEL[c.estado]||c.estado):''} · ${c.total} msgs</div>
    </div>`).join("");
}
async function openConv(phone){
  document.querySelectorAll('.conv').forEach(e=>e.classList.remove('active'));
  const d = await (await api("/api/conversaciones/"+encodeURIComponent(phone))).json();
  const botPill = d.bot_active ? '<span class="pill on">bot activo</span>' : '<span class="pill off">humano al mando</span>';
  let html = `<div class="head"><b>${h(d.name||phone)}</b> <span class="b-ch">${h(d.channel)}</span>
     ${botPill} <span class="sp" style="flex:1"></span>
     <button class="ghost sm" onclick="reiniciarConv('${h(phone)}')">Reiniciar</button>
     <button class="ghost sm" onclick="toggleBot('${h(phone)}')">${d.bot_active?'Tomar chat':'Devolver al bot'}</button></div>`;
  html += '<div class="msgs" id="msgs">';
  for(const m of d.mensajes){ html += `<div class="bub ${m.dir}">${h(m.body)}</div>`; }
  html += '</div>';
  html += `<div class="sendrow"><input id="sendtxt" placeholder="Escribe una respuesta…"
     onkeydown="if(event.key==='Enter')sendMsg('${h(phone)}')">
     <button onclick="sendMsg('${h(phone)}')">Enviar</button></div>`;
  html += `<div class="sendrow" style="border-top:1px dashed var(--line);background:var(--panel2)">
     <input id="simtxt" placeholder="Prueba: escribe como cliente y ve la respuesta del bot…"
     onkeydown="if(event.key==='Enter')simular('${h(phone)}')">
     <button class="ghost" onclick="simular('${h(phone)}')">Simular</button></div>`;
  document.getElementById("chat").innerHTML = html;
  const m = document.getElementById("msgs"); m.scrollTop = m.scrollHeight;
}
async function sendMsg(phone){
  const inp = document.getElementById("sendtxt"); const txt = inp.value.trim();
  if(!txt) return; inp.value="";
  await api("/api/conversaciones/"+encodeURIComponent(phone)+"/enviar",
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({texto:txt})});
  openConv(phone);
}
async function toggleBot(phone){
  await api("/api/conversaciones/"+encodeURIComponent(phone)+"/bot",
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({})});
  openConv(phone);
}
async function reiniciarConv(phone){
  if(!confirm("¿Reiniciar esta conversación? Se borra el historial y el lead vuelve a Nuevo (para pruebas).")) return;
  await api("/api/conversaciones/"+encodeURIComponent(phone)+"/reiniciar", {method:"POST"});
  openConv(phone);
}
async function simular(phone){
  const inp=document.getElementById("simtxt"); const t=inp.value.trim(); if(!t) return; inp.value="";
  await api("/api/conversaciones/"+encodeURIComponent(phone)+"/simular",
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({texto:t})});
  openConv(phone);
}
function nuevaPrueba(){
  const id = "prueba-" + Date.now();
  openConv(id);
}

// ─────────── Métricas (filtro por fechas) ───────────
let M_DESDE="", M_HASTA="", M_PRESET="30";
const CANAL_LBL = {whatsapp:"WhatsApp", instagram:"Instagram", messenger:"Messenger"};
const SEG_LBL = {residencial:"Residencial", oficina:"Oficina", airbnb:"Airbnb", corporativo:"Corporativo", "sin definir":"Sin definir"};

function fmtFecha(d){ return d.toISOString().slice(0,10); }
function setPreset(dias){
  M_PRESET = dias;
  const hoy = new Date();
  M_HASTA = fmtFecha(hoy);
  if(dias==="todo"){ M_DESDE=""; M_HASTA=""; }
  else { const desde=new Date(hoy); desde.setDate(hoy.getDate()-(parseInt(dias)-1)); M_DESDE=fmtFecha(desde); }
  loadMetricas();
}

async function loadMetricas(){
  const cont = document.getElementById("metricas");
  // Estructura fija (filtros) + contenedor de resultados
  if(!document.getElementById("m_body")){
    cont.innerHTML = `
      <div class="filtros">
        <div class="presets" id="m_presets">
          <button data-p="7">7 días</button>
          <button data-p="30">30 días</button>
          <button data-p="90">90 días</button>
          <button data-p="todo">Todo</button>
        </div>
        <div class="f"><label>Desde</label><input type="date" id="m_desde"></div>
        <div class="f"><label>Hasta</label><input type="date" id="m_hasta"></div>
        <button class="sm" onclick="aplicarRango()">Aplicar</button>
      </div>
      <div id="m_body"><div class="muted">Cargando…</div></div>`;
    document.querySelectorAll('#m_presets button').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));
    if(!M_DESDE && M_PRESET!=="todo"){ setPreset(M_PRESET); return; }
  }
  // Marcar preset activo + reflejar fechas
  document.querySelectorAll('#m_presets button').forEach(b=>b.classList.toggle("active", b.dataset.p===M_PRESET));
  document.getElementById("m_desde").value = M_DESDE;
  document.getElementById("m_hasta").value = M_HASTA;

  let qs = [];
  if(M_DESDE) qs.push("desde="+M_DESDE);
  if(M_HASTA) qs.push("hasta="+M_HASTA);
  const d = await (await api("/api/metrics"+(qs.length?("?"+qs.join("&")):""))).json();
  renderMetricas(d);
}
function aplicarRango(){
  M_DESDE = document.getElementById("m_desde").value;
  M_HASTA = document.getElementById("m_hasta").value;
  M_PRESET = "custom";
  loadMetricas();
}

function barras(obj, labels, max){
  const tot = max || Math.max(1, ...Object.values(obj));
  return Object.entries(obj).map(([k,v])=>`
    <div class="bar"><span>${h(labels[k]||k)}</span>
      <span class="track"><i style="width:${Math.round(100*v/tot)}%"></i></span>
      <span class="val">${v}</span></div>`).join("") || '<div class="muted">Sin datos</div>';
}

function renderMetricas(d){
  const body = document.getElementById("m_body");
  const rango = (d.rango.desde||d.rango.hasta)
    ? `del ${d.rango.desde||'inicio'} al ${d.rango.hasta||'hoy'}` : "de todo el histórico";
  const ESTADO_L = {nuevo:"Nuevo",interesado:"Interesado",calificado:"Calificado",asignado:"Asignado",ganado:"Ganado",perdido:"Perdido"};

  // KPIs
  const kpis = `
    <div class="kpis">
      <div class="kpi"><div class="v">${d.total}</div><div class="k">Leads que entraron</div></div>
      <div class="kpi"><div class="v" style="color:var(--ok)">${d.buenos}</div><div class="k">Buenos leads (calificados+)</div>
        <div class="s" style="color:var(--ok)">${d.tasa_calificacion}% del total</div></div>
      <div class="kpi"><div class="v">${d.ganados}</div><div class="k">Ganados</div>
        <div class="s" style="color:var(--brand)">${d.tasa_ganado}% del total</div></div>
      <div class="kpi"><div class="v">${d.alertados}</div><div class="k">Alertas al equipo</div></div>
      <div class="kpi"><div class="v">${d.score_promedio}</div><div class="k">Score promedio</div></div>
      <div class="kpi"><div class="v" style="color:var(--hot)">${d.perdidos}</div><div class="k">Perdidos</div></div>
    </div>`;

  // Serie diaria (spark)
  const serie = d.serie||[];
  const maxDia = Math.max(1, ...serie.map(x=>x.total));
  const spark = serie.length ? `
    <div class="spark">${serie.map(x=>`
      <div class="d" style="height:${Math.round(100*x.total/maxDia)}%" title="${x.fecha}: ${x.total} leads (${x.buenos} buenos)">
        <i style="height:${x.total?Math.round(100*x.buenos/x.total):0}%"></i></div>`).join("")}</div>
    <div class="sparklbls"><span>${serie[0].fecha}</span><span>${serie[serie.length-1].fecha}</span></div>`
    : '<div class="muted">Sin leads en este rango</div>';

  body.innerHTML = kpis + `
    <div class="mcard" style="margin-bottom:16px">
      <h3>Leads por día · ${rango}</h3>
      ${spark}
      <div class="muted" style="font-size:12px;margin-top:8px">Barra = leads que entraron ese día · relleno oscuro = buenos leads.</div>
    </div>
    <div class="mgrid">
      <div class="mcard"><h3>Embudo por etapa</h3>${barras(d.por_estado, ESTADO_L, d.total)}</div>
      <div class="mcard"><h3>Por marca</h3>${barras(d.por_marca||{}, {rentals:"EMA Rentals", office:"EMA Office", "sin definir":"Sin definir"})}</div>
      <div class="mcard"><h3>Por modelo</h3>${barras(d.por_modelo||{}, {renta:"Renta", venta:"Venta", "sin definir":"Sin definir"})}</div>
      <div class="mcard"><h3>Por canal</h3>${barras(d.por_canal, CANAL_LBL)}</div>
      <div class="mcard"><h3>Por tipo de propiedad</h3>${barras(d.por_tipo||{}, {oficina:"Oficina", departamento:"Departamento", casa:"Casa", "sin definir":"Sin definir"})}</div>
      <div class="mcard"><h3>Resumen del rango</h3>
        <div class="kv">
          <div class="row"><span class="k">Total de leads</span><span class="v">${d.total}</span></div>
          <div class="row"><span class="k">Buenos leads</span><span class="v">${d.buenos} (${d.tasa_calificacion}%)</span></div>
          <div class="row"><span class="k">Ganados</span><span class="v">${d.ganados} (${d.tasa_ganado}%)</span></div>
          <div class="row"><span class="k">Perdidos</span><span class="v">${d.perdidos}</span></div>
          <div class="row"><span class="k">Alertas enviadas</span><span class="v">${d.alertados}</span></div>
          <div class="row"><span class="k">Score promedio</span><span class="v">${d.score_promedio}/100</span></div>
        </div>
      </div>
    </div>`;
}

      </div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button onclick="guardarContexto()" id="ctx_save">Agregar contexto</button>
        <button class="ghost" id="ctx_cancel" style="display:none" onclick="cancelCtx()">Cancelar</button>
      </div></div>` : '';
  cont.innerHTML = form + '<div id="ctxlist"><div class="muted">Cargando…</div></div>';
  await renderContexto();
}
async function renderContexto(){
  const admin = ME.rol==="dueno";
  const filas = await (await api("/api/contexto")).json();
  const list = document.getElementById("ctxlist");
  if(!filas.length){ list.innerHTML='<div class="muted">Aún no hay contexto. Agrega el primero para alimentar al bot.</div>'; return; }
  list.innerHTML = filas.map(c=>`<div class="ctxcard">
    <div class="ct"><span class="${c.activo?'dot-on':'dot-off'}"></span>${h(c.titulo)}
      <span class="ctxtipo ${c.tipo==='regla'?'t-regla':'t-dato'}">${c.tipo==='regla'?'regla':'dato'}</span>
      <span class="muted" style="font-weight:400;font-size:11.5px">${c.activo?'activo':'inactivo'}</span></div>
    <div class="cc">${h(c.contenido)}</div>
    ${admin?`<div class="cacts">
      <button class="ghost sm" onclick='editCtx(${c.id})'>Editar</button>
      <button class="ghost sm" onclick='toggleCtx(${c.id})'>${c.activo?'Desactivar':'Activar'}</button>
      <button class="danger sm" onclick='borrarCtx(${c.id})'>Borrar</button>
    </div>`:''}
  </div>`).join("");
  window._CTX = filas;
}
async function guardarContexto(){
  const titulo=document.getElementById("ctx_titulo").value.trim();
  const contenido=document.getElementById("ctx_cont").value.trim();
  if(!titulo||!contenido){ alert("Título y contenido son obligatorios"); return; }
  const tipo=(document.querySelector('input[name="ctx_tipo"]:checked')||{}).value||"dato";
  if(CTX_EDIT){
    await api("/api/contexto/"+CTX_EDIT,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({titulo,contenido,tipo,activo:true})});
    cancelCtx();
  }else{
    await api("/api/contexto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({titulo,contenido,tipo,activo:true})});
    document.getElementById("ctx_titulo").value=""; document.getElementById("ctx_cont").value="";
  }
  await renderContexto();
}
function editCtx(id){
  const c=(window._CTX||[]).find(x=>x.id===id); if(!c) return;
  CTX_EDIT=id;
  document.getElementById("ctxTitle").textContent="Editar contexto";
  document.getElementById("ctx_titulo").value=c.titulo;
  document.getElementById("ctx_cont").value=c.contenido;
  const r=document.querySelector(`input[name="ctx_tipo"][value="${c.tipo||'dato'}"]`); if(r) r.checked=true;
  document.getElementById("ctx_save").textContent="Guardar cambios";
  document.getElementById("ctx_cancel").style.display="inline-block";
  document.getElementById("ctxform").scrollIntoView({behavior:"smooth"});
}
function cancelCtx(){
  CTX_EDIT=null;
  document.getElementById("ctxTitle").textContent="Nuevo contexto";
  document.getElementById("ctx_titulo").value=""; document.getElementById("ctx_cont").value="";
  document.getElementById("ctx_save").textContent="Agregar contexto";
  document.getElementById("ctx_cancel").style.display="none";
}
async function toggleCtx(id){ await api("/api/contexto/"+id+"/toggle",{method:"POST"}); await renderContexto(); }
async function borrarCtx(id){ if(!confirm("¿Borrar este contexto?"))return; await api("/api/contexto/"+id,{method:"DELETE"}); await renderContexto(); }

// ─────────── Fases del pipeline ───────────
// La fila de cada fase lleva SOLO sus dos toggles: si notifica y si entra a recuperación.
// A quién se le avisa es una lista global (el recuadro de arriba). El mensaje de cierre y los
// criterios se editan desde la ⓘ de cada columna en Leads, para no recargar esta tabla.
let CONTACTOS = [];
let SCORE_INFO = null;

async function loadFases(){
  const cont = document.getElementById("fases");
  const admin = ME.rol === "dueno";
  await cargarFases();
  CONTACTOS = await (await api("/api/fases/contactos")).json();
  const algunaNotifica = FASES.some(f=>f.notificar);

  cont.innerHTML = recuadroContactos(admin, algunaNotifica) + `
    <div class="fasesbox">
      <h3 style="margin:0 0 4px">Etapas del pipeline</h3>
      <p class="muted" style="margin:0 0 16px;font-size:13px">
        Arrastra para reordenar. Activa <b>Notificación</b> para avisar cuando un lead caiga en esa
        etapa, o <b>Recuperación</b> para reactivar a los que se quedaron ahí.
        El mensaje de cierre y los criterios de cada etapa se editan desde la <b>ⓘ</b> de su columna
        en <b>Leads</b>.</p>
      <div class="fasehead">
        <span></span><span>TÍTULO</span><span>DESCRIPCIÓN</span>
        <span>NOTIFICACIÓN</span><span>RECUPERACIÓN</span><span></span>
      </div>
      <div id="faselist">${FASES.map(f=>filaFase(f,admin)).join("")}</div>
      ${admin?`<button class="ghost nuevaetapa" onclick="agregarFase()">+ Nueva etapa</button>`:''}
    </div>`;
  if(admin) activarArrastre();
}

// Recuadro de destinatarios, con el look del de "Números sin bot" de aseguradora.
function recuadroContactos(admin, algunaNotifica){
  const filas = CONTACTOS.length
    ? CONTACTOS.map(c=>`<tr>
        <td style="font-weight:500">${h(c.nombre)}</td>
        <td class="muted">${h(c.telefono)}</td>
        <td class="ctacts">${admin?`<button class="danger sm" title="Quitar de la lista"
          onclick="borrarContacto(${c.id})">🗑</button>`:''}</td></tr>`).join("")
    : `<tr><td colspan="3" class="cvacio">Aún no hay nadie en la lista.</td></tr>`;
  const aviso = (algunaNotifica && !CONTACTOS.length)
    ? `<div class="favi">Hay etapas con la notificación activa pero la lista está vacía:
        los avisos se mandarán a los teléfonos de ALERTA_ADMIN_TELEFONOS.</div>` : '';
  return `
    <div class="fasesbox" style="margin-bottom:14px">
      <h3 style="margin:0 0 4px">A quién avisar <span class="cbadge">${CONTACTOS.length}</span></h3>
      <p class="muted" style="margin:0 0 12px;font-size:13px">
        Estas personas reciben el aviso cuando un lead cae en una etapa con la
        <b>Notificación</b> activa. La lista es la misma para todas las etapas.</p>
      ${aviso}
      ${admin?`<div class="addcontacto">
        <input id="ct_nombre" placeholder="Nombre (ej. Emiliano)">
        <input id="ct_tel" placeholder="528112345678">
        <button onclick="agregarContacto()">Agregar</button>
      </div>`:''}
      <div class="ctblwrap"><table class="ctbl">
        <thead><tr><th style="width:42%">NOMBRE</th><th>TELÉFONO</th><th style="width:56px"></th></tr></thead>
        <tbody>${filas}</tbody>
      </table></div>
    </div>`;
}

function filaFase(f,admin){
  return `
  <div class="faserow" data-id="${f.id}" ${admin?'draggable="true"':''}>
    <div class="fmain">
      <span class="fdrag" title="Arrastra para reordenar">⠿</span>
      <input type="color" class="fdot" value="${f.color}" ${admin?'':'disabled'}
             id="fc_${f.id}" onchange="guardarFase(${f.id})">
      <span class="ftitulo">
        <input value="${h(f.nombre)}" id="fn_${f.id}" ${admin?'':'disabled'} onchange="guardarFase(${f.id})">
      </span>
      <span class="fdesc">
        <input value="${h(f.descripcion||'')}" id="fd_${f.id}" ${admin?'':'disabled'}
               placeholder="Sin descripción" onchange="guardarFase(${f.id})">
      </span>
      <span>${pill(f,'notificar','Notificación')}</span>
      <span>${pill(f,'recuperar','Recuperación')}</span>
      <span class="facts">
        ${admin&&f.editable_borrar?`<button class="danger sm" onclick="borrarFase(${f.id})">×</button>`:''}
      </span>
    </div>
  </div>`;
}

function pill(f,campo,label){
  const cls = campo==='notificar' ? 'p-noti' : 'p-recu';
  return `<button class="fpill ${cls} ${f[campo]?'on':''}" onclick="toggleFase(${f.id},'${campo}')">
    <i></i>${label}</button>`;
}

function cuerpoFase(id){
  const g=(p)=>document.getElementById(p+id);
  return {nombre:g("fn_").value.trim(), descripcion:g("fd_").value, color:g("fc_").value};
}
async function guardarFase(id){
  await api("/api/fases/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(cuerpoFase(id))});
  await loadFases();
}
async function toggleFase(id,campo){
  const f = FASES.find(x=>x.id===id); if(!f) return;
  await api("/api/fases/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign(cuerpoFase(id), {[campo]: !f[campo]}))});
  await loadFases();
}
async function agregarContacto(){
  const nombre=document.getElementById("ct_nombre").value.trim();
  const telefono=document.getElementById("ct_tel").value.trim();
  if(!nombre||!telefono){ alert("Nombre y teléfono son obligatorios"); return; }
  await api("/api/fases/contactos",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nombre,telefono})});
  await loadFases();
}
async function borrarContacto(id){
  if(!confirm("¿Quitar a esta persona de la lista? Dejará de recibir los avisos.")) return;
  await api("/api/fases/contactos/"+id,{method:"DELETE"});
  await loadFases();
}
async function agregarFase(){
  const nombre = prompt("Nombre de la nueva etapa:");
  if(!nombre||!nombre.trim()) return;
  await api("/api/fases",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nombre:nombre.trim()})});
  await loadFases();
}
async function borrarFase(id){
  const f = FASES.find(x=>x.id===id) || {};
  // Borrar la fase de entrada es legal pero tiene un efecto poco obvio: los leads que aún no
  // dicen el tipo de propiedad acaban en la primera columna que quede, sea cual sea.
  const msg = f.rol === "entrada"
    ? `"${f.nombre}" es la etapa de ENTRADA: es donde caen los leads que apenas escriben y todavía no dicen qué tipo de propiedad buscan.\n\nSi la borras, esos leads se irán a "${(FASES.find(x=>x.id!==id)||{}).nombre||'la primera columna'}", que probablemente no es lo que quieres.\n\n¿Borrarla de todos modos?`
    : `¿Borrar la etapa "${f.nombre}"? Sus leads pasan a la etapa de entrada.`;
  if(!confirm(msg)) return;
  await api("/api/fases/"+id,{method:"DELETE"});
  await loadFases();
}

// Reordenar arrastrando. El endpoint /reordenar ya existía; antes solo había botones ↑↓.
function activarArrastre(){
  const lista = document.getElementById("faselist");
  if(!lista) return;
  let origen = null;
  lista.querySelectorAll(".faserow").forEach(row=>{
    row.addEventListener("dragstart", e=>{ origen=row; row.classList.add("arrastrando"); e.dataTransfer.effectAllowed="move"; });
    row.addEventListener("dragend", ()=>{ row.classList.remove("arrastrando"); guardarOrdenDOM(); });
    row.addEventListener("dragover", e=>{
      e.preventDefault();
      if(!origen||origen===row) return;
      const r = row.getBoundingClientRect();
      const despues = (e.clientY - r.top) > r.height/2;
      lista.insertBefore(origen, despues ? row.nextSibling : row);
    });
  });
}
async function guardarOrdenDOM(){
  const ids = [...document.querySelectorAll("#faselist .faserow")].map(r=>parseInt(r.dataset.id));
  await api("/api/fases/reordenar",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ids})});
  await loadFases();
}

// ─────────── Usuarios (crear + asignar secciones) ───────────
let EDIT_ID = null;
function secCheckboxes(marcadas){
  return SEC_CAT.map(s=>`<label class="chk"><input type="checkbox" value="${s.clave}" ${marcadas.includes(s.clave)?'checked':''}> ${h(s.etiqueta)}</label>`).join("");
}
async function loadUsuarios(){
  const cont = document.getElementById("usuarios");
  const soloAdmin = ME.rol==="dueno";
  let form = "";
  if(soloAdmin){
    form = `<div class="panelbox" id="uform">
      <h3 id="uformTitle">Nuevo usuario</h3>
      <div class="grid2">
        <div><label class="muted" style="font-size:12px">Nombre</label><input id="u_nombre" placeholder="Nombre"></div>
        <div><label class="muted" style="font-size:12px">Correo</label><input id="u_email" type="email" placeholder="correo@ema-rentals.com"></div>
      </div>
      <div class="grid2">
        <div><label class="muted" style="font-size:12px">Contraseña</label><input id="u_pass" type="password" placeholder="mín. 6 caracteres"></div>
        <div><label class="muted" style="font-size:12px">Rol</label>
          <select id="u_rol" onchange="rolPreset()">
            <option value="asesor">Asesor</option>
            <option value="coordinador">Coordinador</option>
            <option value="dueno">Dueño (ve todo)</option>
          </select></div>
      </div>
      <label class="muted" style="font-size:12px">Secciones que puede ver</label>
      <div class="checks" id="u_secs">${secCheckboxes(["leads","bandeja"])}</div>
      <div class="err" id="u_err"></div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button onclick="guardarUsuario()" id="u_save">Crear usuario</button>
        <button class="ghost" id="u_cancel" style="display:none" onclick="cancelEdit()">Cancelar</button>
      </div>
    </div>`;
  }
  cont.innerHTML = form + '<div id="ulist"><div class="muted">Cargando…</div></div>';
  rolPreset();
  await renderUsuariosLista();
}
function rolPreset(){
  // Al elegir "dueño" marca todas y deshabilita edición fina (ve todo).
  const rol = (document.getElementById("u_rol")||{}).value;
  if(!document.getElementById("u_secs")) return;
  if(rol==="dueno"){
    document.querySelectorAll('#u_secs input').forEach(c=>{c.checked=true; c.disabled=true;});
  }else{
    document.querySelectorAll('#u_secs input').forEach(c=>{c.disabled=false;});
  }
}
async function renderUsuariosLista(){
  const soloAdmin = ME.rol==="dueno";
  const us = await (await api("/api/usuarios")).json();
  const rows = us.map(u=>{
    const secs = (u.rol==="dueno") ? '<span class="secchip">todas</span>'
      : (u.secciones||[]).map(s=>`<span class="secchip">${h((SEC_CAT.find(x=>x.clave===s)||{}).etiqueta||s)}</span>`).join("") || '<span class="muted">—</span>';
    const acts = soloAdmin ? `
      <button class="ghost sm" onclick='editUsuario(${u.id})'>Editar acceso</button>
      <button class="ghost sm" onclick='toggleUsuario(${u.id})'>${u.activo?'Desactivar':'Activar'}</button>
      <button class="ghost sm" onclick='resetPass(${u.id})'>Reset contraseña</button>` : '';
    return `<tr>
      <td><b>${h(u.nombre||'—')}</b><br><span class="muted" style="font-size:12px">${h(u.email)}</span></td>
      <td><span class="rolechip">${h(u.rol)}</span></td>
      <td>${secs}</td>
      <td>${u.activo?'<span class="tag-on">Activo</span>':'<span class="tag-off">Inactivo</span>'}</td>
      ${soloAdmin?`<td style="white-space:nowrap">${acts}</td>`:''}
    </tr>`;
  }).join("");
  document.getElementById("ulist").innerHTML = `<table class="utable">
    <thead><tr><th>Usuario</th><th>Rol</th><th>Secciones</th><th>Estado</th>${soloAdmin?'<th>Acciones</th>':''}</tr></thead>
    <tbody>${rows}</tbody></table>`;
  window._USERS = us;
}
function _secsMarcadas(){
  return [...document.querySelectorAll('#u_secs input:checked')].map(c=>c.value);
}
async function guardarUsuario(){
  const err=document.getElementById("u_err"); err.textContent="";
  const rol=document.getElementById("u_rol").value;
  const payload={ nombre:document.getElementById("u_nombre").value.trim(),
    rol, secciones:_secsMarcadas() };
  try{
    if(EDIT_ID){
      await api("/api/usuarios/"+EDIT_ID+"/acceso",{method:"PUT",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({rol:payload.rol, secciones:payload.secciones})});
      cancelEdit();
    }else{
      payload.email=document.getElementById("u_email").value.trim();
      payload.password=document.getElementById("u_pass").value;
      if(!payload.email || payload.password.length<6){ err.textContent="Correo válido y contraseña de mín. 6 caracteres."; return; }
      const r=await api("/api/usuarios",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(!r.ok){ const e=await r.json(); err.textContent=e.detail||"No se pudo crear"; return; }
      document.getElementById("u_nombre").value=""; document.getElementById("u_email").value=""; document.getElementById("u_pass").value="";
    }
    await renderUsuariosLista();
  }catch(e){ err.textContent="Error: "+e.message; }
}
function editUsuario(id){
  const u=(window._USERS||[]).find(x=>x.id===id); if(!u) return;
  EDIT_ID=id;
  document.getElementById("uformTitle").textContent="Editar acceso · "+(u.nombre||u.email);
  document.getElementById("u_email").value=u.email; document.getElementById("u_email").disabled=true;
  document.getElementById("u_nombre").value=u.nombre||""; document.getElementById("u_nombre").disabled=true;
  document.getElementById("u_pass").parentElement.style.display="none";
  document.getElementById("u_rol").value=u.rol;
  document.getElementById("u_secs").innerHTML=secCheckboxes(u.rol==="dueno"?SEC_CAT.map(s=>s.clave):(u.secciones||[]));
  rolPreset();
  document.getElementById("u_save").textContent="Guardar acceso";
  document.getElementById("u_cancel").style.display="inline-block";
  document.getElementById("uform").scrollIntoView({behavior:"smooth"});
}
function cancelEdit(){
  EDIT_ID=null;
  document.getElementById("uformTitle").textContent="Nuevo usuario";
  document.getElementById("u_email").disabled=false; document.getElementById("u_email").value="";
  document.getElementById("u_nombre").disabled=false; document.getElementById("u_nombre").value="";
  document.getElementById("u_pass").parentElement.style.display="block";
  document.getElementById("u_secs").innerHTML=secCheckboxes(["leads","bandeja"]);
  document.getElementById("u_rol").value="asesor"; rolPreset();
  document.getElementById("u_save").textContent="Crear usuario";
  document.getElementById("u_cancel").style.display="none";
  document.getElementById("u_err").textContent="";
}
async function toggleUsuario(id){
  await api("/api/usuarios/"+id+"/toggle",{method:"POST"});
  await renderUsuariosLista();
}
async function resetPass(id){
  const p=prompt("Nueva contraseña (mín. 6 caracteres):");
  if(!p) return;
  if(p.length<6){ alert("Mínimo 6 caracteres"); return; }
  const r=await api("/api/usuarios/"+id+"/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});
  alert(r.ok?"Contraseña actualizada":"No se pudo actualizar");
}

if(TOKEN){ boot(); }
</script>
